name: Automated Data Ingestion Pipeline

on:
  schedule:
    - cron: '0 0 * * *'   # Automated job runs every single night at 00:00 UTC
  workflow_dispatch:        # Enables your manual "Run workflow" drop-down trigger button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests
        run: |
          pytest -q

      - name: Execute Live Data Harvest Pipeline
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python data_ingestion_pipeline.py

      - name: Evaluate and Commit Storage Increments
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data_warehouse/ logs/ reports/

          if git diff --staged --quiet; then
            echo "No external upstream modifications tracked. Skipping workspace commit."
          else
            git commit -m "Automated Warehouse Refresh: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi
